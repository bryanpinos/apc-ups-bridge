; APC UPS -> MQTT bridge
; Adafruit ESP32-S3 Feather (8MB, no PSRAM) + USB Host FeatherWing (MAX3421E)
[env:feather]
platform      = espressif32@6.9.0
board         = adafruit_feather_esp32s3_nopsram
framework     = arduino
monitor_speed = 115200
upload_port   = /dev/cu.usbmodem2101   ; first flash only; OTA after that
monitor_port  = /dev/cu.usbmodem2101

lib_deps =
  adafruit/Adafruit TinyUSB Library
  knolleary/PubSubClient
  adafruit/Adafruit MAX1704X
  bblanchon/ArduinoJson

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; bisect env: no libraries, board-default USB mode (TinyUSB CDC)
[env:mintest]
platform      = espressif32@6.9.0
board         = adafruit_feather_esp32s3_nopsram
framework     = arduino
monitor_speed = 115200
upload_port   = /dev/cu.usbmodem2101   ; first flash only; OTA after that
build_flags   = -DARDUINO_USB_CDC_ON_BOOT=1

; OTA env: password comes from the environment, never from disk
[env:ota]
extends         = env:feather
upload_protocol = espota
upload_port     = ${sysenv.OTA_HOST}
upload_flags    = --auth=${sysenv.OTA_PW}
