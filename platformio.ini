; APC UPS -> MQTT bridge
; Adafruit ESP32-S3 Feather (8MB, no PSRAM) + USB Host FeatherWing (MAX3421E)
[env:feather]
platform      = espressif32@6.9.0
board         = adafruit_feather_esp32s3_nopsram
framework     = arduino
monitor_speed = 115200
upload_port   = /dev/cu.usbmodem2101   ; first flash only; OTA after that
monitor_port  = /dev/cu.usbmodem2101

lib_deps =
  adafruit/Adafruit TinyUSB Library
  knolleary/PubSubClient
  adafruit/Adafruit MAX1704X
  bblanchon/ArduinoJson

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; Build identity (git sha + UTC build time) -> published as "build" in diag,
  ; so `ota-flash --check apc-ups <unit>` answers "is my fix running?". fw alone
  ; could not: it would read 1.11.2 even when built from uncommitted code.
  !python tools/build_id.py

; bisect env: no libraries, board-default USB mode (TinyUSB CDC)
[env:mintest]
platform      = espressif32@6.9.0
board         = adafruit_feather_esp32s3_nopsram
framework     = arduino
monitor_speed = 115200
upload_port   = /dev/cu.usbmodem2101   ; first flash only; OTA after that
build_flags   = -DARDUINO_USB_CDC_ON_BOOT=1

; OTA env: password comes from the environment, never from disk
[env:ota]
extends         = env:feather
upload_protocol = espota
upload_port     = ${sysenv.OTA_HOST}
upload_flags    = --auth=${sysenv.OTA_PW}

; Same firmware on the 4MB / 2MB-PSRAM Feather (PID 5477). Identical PCB and
; pinout to the 8MB no-PSRAM board -- both are qio flash mode, so the quad PSRAM
; shares the flash bus and does NOT consume GPIO33-37; SPI (SCK36/MOSI35/MISO37)
; to the MAX3421E is unaffected. PSRAM simply goes unused.
[env:feather4mb]
extends = env:feather
board   = adafruit_feather_esp32s3
